services:

  postgres-flow-manager:
    image: postgres:15
    container_name: postgres-flow-manager
    environment:
      POSTGRES_DB: ${FLOW_MANAGER_POSTGRES_DB}
      POSTGRES_USER: ${FLOW_MANAGER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FLOW_MANAGER_POSTGRES_PASSWORD}
    ports:
      - "${FLOW_MANAGER_POSTGRES_PORT}:5432"
    volumes:
      - flow_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FLOW_MANAGER_POSTGRES_USER} -d ${FLOW_MANAGER_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - microservices-net

  flow-manager:
    image: ${FLOW_MANAGER_IMAGE}
    depends_on:
      postgres-flow-manager:
        condition: service_healthy
    environment:
      SERVER_PORT: 0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-flow-manager:5432/${FLOW_MANAGER_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${FLOW_MANAGER_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${FLOW_MANAGER_POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      FILE_CONVERSION_INPUT_TOPIC: ${FILE_CONVERSION_INPUT_TOPIC}
      FILE_CONVERSION_OUTPUT_TOPIC: ${FILE_CONVERSION_OUTPUT_TOPIC}
      FILE_CONVERSION_DLT_SUFFIX: ${FILE_CONVERSION_DLT_SUFFIX}
      APP_OUTBOX_PUBLISH_INTERVAL_MS: ${APP_OUTBOX_PUBLISH_INTERVAL_MS}
      APP_OUTBOX_BATCH_SIZE: ${APP_OUTBOX_BATCH_SIZE}
      APP_OUTBOX_MAX_PUBLISH_ATTEMPTS: ${APP_OUTBOX_MAX_PUBLISH_ATTEMPTS}
      MINIO_URL: ${MINIO_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
    networks:
      - microservices-net

  postgres-file-conversion:
    image: postgres:15
    container_name: postgres-file-conversion
    environment:
      POSTGRES_DB: ${FILE_CONVERSION_POSTGRES_DB}
      POSTGRES_USER: ${FILE_CONVERSION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FILE_CONVERSION_POSTGRES_PASSWORD}
    ports:
      - "${FILE_CONVERSION_POSTGRES_PORT}:5432"
    volumes:
      - file_conversion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FILE_CONVERSION_POSTGRES_USER} -d ${FILE_CONVERSION_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - microservices-net

  file-conversion-service:
    image: ${FILE_CONVERSION_IMAGE}
    depends_on:
      postgres-file-conversion:
        condition: service_healthy
    environment:
      SERVER_PORT: 0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-file-conversion:5432/${FILE_CONVERSION_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${FILE_CONVERSION_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${FILE_CONVERSION_POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      FILE_CONVERSION_INPUT_TOPIC: ${FILE_CONVERSION_INPUT_TOPIC}
      FILE_CONVERSION_OUTPUT_TOPIC: ${FILE_CONVERSION_OUTPUT_TOPIC}
      FILE_CONVERSION_DLT_SUFFIX: ${FILE_CONVERSION_DLT_SUFFIX}
      APP_CONVERSION_DELETE_SOURCE: ${APP_CONVERSION_DELETE_SOURCE}
      APP_CONVERSION_RESULT_PREFIX: ${APP_CONVERSION_RESULT_PREFIX}
      APP_INBOX_POLL_INTERVAL_MS: ${APP_INBOX_POLL_INTERVAL_MS}
      APP_INBOX_BATCH_SIZE: ${APP_INBOX_BATCH_SIZE}
      APP_INBOX_MAX_PROCESSING_ATTEMPTS: ${APP_INBOX_MAX_PROCESSING_ATTEMPTS}
      APP_INBOX_RETRY_DELAY_MS: ${APP_INBOX_RETRY_DELAY_MS}
      APP_INBOX_PROCESSING_TIMEOUT_MS: ${APP_INBOX_PROCESSING_TIMEOUT_MS}
      MINIO_URL: ${MINIO_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
    networks:
      - microservices-net

  api-gateway:
    image: ${API_GATEWAY_IMAGE}
    ports:
      - "${API_GATEWAY_PORT}:8765"
    environment:
      SERVER_PORT: 8765
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
    networks:
      - microservices-net

networks:
  microservices-net:
    name: ${MICROSERVICES_NETWORK}

volumes:
  flow_manager_postgres_data:
  file_conversion_postgres_data:
